<script>
  // Mismo enlace que en index.html (Drive "compartir" sirve: se convierte solo)
  var APK_URL = 'PEGA_AQUI_EL_ENLACE_DEL_APK';
  function directo(u) {
    var m = u.match(/drive\.google\.com\/file\/d\/([^/?#]+)/) || u.match(/[?&]id=([^&#]+)/);
    return (m && u.indexOf('drive.google.com') >= 0)
      ? 'https://drive.google.com/uc?export=download&id=' + m[1] : u;
  }
  var url = directo(APK_URL);
  document.getElementById('b').href = url;
  // inicia la descarga sola al abrir el enlace
  setTimeout(function () { window.location.href = url; }, 700);
</script>
